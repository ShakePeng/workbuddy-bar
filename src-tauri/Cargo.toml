[package]
name = "workbuddy-bar"
version = "1.1.6"
description = "WorkBuddyBar menu bar monitor"
authors = ["ShakePeng"]
edition = "2021"

[lib]
name = "workbuddy_bar_lib"
# 只发布桌面端：桌面构建只需要 rlib。原先的 staticlib/cdylib 会让同一份代码
# 多跑两遍 LTO（Windows 上还会多产出 131MB 的 .lib），大幅拖慢 CI 与缓存。
# 将来要做 iOS/Android 时再改回 ["staticlib", "cdylib", "rlib"]。
crate-type = ["lib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time", "fs", "io-util"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
