name: Release

# 同一个提交会同时产生 main 的预热 run 与 tag 的发布 run，用 run-name 区分，
# 避免在 Actions 列表里出现两个同名的 "Release #N"。
run-name: "${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'Cache warm-up (main)' }}"

on:
  push:
    tags:
      - 'v*'
    # main 上的推送只用于预热编译缓存（见下方 Build 步骤），不打标签、不发布。
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: "${{ startsWith(github.ref, 'refs/tags/') && 'Build' || 'Warm cache' }} ${{ matrix.platform }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-14
            rust_targets: aarch64-apple-darwin
            app_args: --target aarch64-apple-darwin --bundles app --ci --no-sign
            dmg_args: --target aarch64-apple-darwin --bundles dmg --ci --no-sign
            warm_args: --target aarch64-apple-darwin --ci --no-sign --no-bundle
          - platform: windows-x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            build_args: --bundles nsis --ci
            warm_args: --ci --no-bundle

    env:
      YARN_REGISTRY: https://registry.npmmirror.com

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      # Windows Defender 会实时扫描 cargo 生成的成千上万个小文件，是纯粹额外开销。
      # 托管 runner 是一次性的，排除路径只影响本次构建；失败也不影响流程。
      - name: Exclude build paths from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\src-tauri\target", "$env:RUNNER_TEMP", "$env:LOCALAPPDATA\Yarn"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Yarn
        shell: bash
        run: npm install --global yarn@1.22.22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # 前端依赖只有 80 多个包（冷装约 20s），缓存保存却要 1 分多钟，
      # 还会挤占仓库 10GB 的缓存配额，因此不再缓存 Yarn。
      # prefix-key 在发布 profile 改动后主动让旧缓存失效一次。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.platform }}
          prefix-key: v1-thin
          cache-on-failure: true

      - name: Cache Tauri bundler tools
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/tauri
            ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}-${{ hashFiles('src-tauri/tauri.conf.json') }}

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          expected="${TAG_NAME#v}"
          if [[ ! "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use v<semver>, got: ${TAG_NAME}" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          cargo_lock_version="$(awk '/^name = "workbuddy-bar"$/{getline; print; exit}' src-tauri/Cargo.lock | sed -E 's/^version = "([^"]+)"$/\1/')"

          if [[ "$package_version" != "$expected" || "$tauri_version" != "$expected" || "$cargo_version" != "$expected" || "$cargo_lock_version" != "$expected" ]]; then
            echo "Release version mismatch:" >&2
            echo "  tag:        ${expected}" >&2
            echo "  package:    ${package_version}" >&2
            echo "  tauri:      ${tauri_version}" >&2
            echo "  cargo:      ${cargo_version}" >&2
            echo "  cargo.lock: ${cargo_lock_version}" >&2
            exit 1
          fi

          # 发布说明取自 CHANGELOG.md：缺段落就直接失败，不必浪费一次完整构建。
          if ! grep -qE "^## \[${expected}\]" CHANGELOG.md; then
            echo "CHANGELOG.md 中缺少 ${expected} 的更新日志，请补充后再打标签" >&2
            exit 1
          fi

      # Windows 上再跑一遍 cargo test，等于用 dev profile 把 500+ crate 重编一次
      # （实测 7 分 18 秒），所以测试只在 macOS 跑一遍；Windows 专属的编译问题
      # 仍会由下面的 release 构建暴露。
      - name: Run tests
        if: matrix.platform == 'macos-aarch64'
        run: yarn test

      # 发布构建改用 thin LTO + 16 个 codegen unit，避免 full LTO 在 MSVC 上
      # 把代码生成与链接串行化；本地 `yarn tauri:build` 仍是 Cargo.toml 里的 full LTO。
      # main 上只预热编译缓存：不打包、不产出安装包。
      - name: Build Tauri bundle (warm cache)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: yarn tauri build ${{ matrix.warm_args }}

      # Tauri 的 DMG 打包脚本会清理 bundle/macos 下的 .app，因此 macOS 需要先单独
      # 构建 app、压缩完成后再构建 DMG；Windows 的构建流程保持不变。
      - name: Build macOS app bundle
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: yarn tauri build ${{ matrix.app_args }}

      - name: Collect macOS app archive
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo 'No macOS app bundle was produced' >&2
            exit 1
          fi
          mkdir -p release
          ditto -c -k --keepParent "$app_path" "release/WorkBuddyBar-${TAG_NAME}-macos-aarch64.app.zip"

      - name: Build macOS DMG bundle
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: yarn tauri build ${{ matrix.dmg_args }}

      - name: Collect macOS installer
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          installer="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$installer" ]]; then
            echo 'No macOS DMG was produced' >&2
            exit 1
          fi
          mkdir -p release
          cp "$installer" "release/WorkBuddyBar-${TAG_NAME}-macos-aarch64.dmg"

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: yarn tauri build ${{ matrix.build_args }}

      - name: Collect Windows installer
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No Windows NSIS installer was produced' }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination "release/WorkBuddyBar-$env:TAG_NAME-windows-x64-setup.exe"

      - name: Upload platform installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.app.zip' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      # 更新内容取自 CHANGELOG.md 中该版本的段落，后面固定附上安装说明。
      - name: Build release notes
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          notes="$(awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md)"

          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md 中找不到 ${version} 的更新日志" >&2
            exit 1
          fi

          asset_win="WorkBuddyBar-${TAG_NAME}-windows-x64-setup.exe"
          asset_mac="WorkBuddyBar-${TAG_NAME}-macos-aarch64.dmg"
          asset_app="WorkBuddyBar-${TAG_NAME}-macos-aarch64.app.zip"
          test -f "release-assets/${asset_win}"
          test -f "release-assets/${asset_mac}"
          test -f "release-assets/${asset_app}"

          VERSION="$version" TAG_NAME="$TAG_NAME" NOTES="$notes" \
            ASSET_WIN="$asset_win" ASSET_MAC="$asset_mac" \
            python3 - <<'PY'
          import json
          import os

          manifest = {
              "version": os.environ["VERSION"],
              "tag": os.environ["TAG_NAME"],
              "notes": os.environ["NOTES"],
              "assets": {
                  "windows-x64": os.environ["ASSET_WIN"],
                  "macos-aarch64": os.environ["ASSET_MAC"],
              },
          }
          path = "release-assets/latest.json"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
              handle.write("\n")

          with open(path, encoding="utf-8") as handle:
              written = json.load(handle)
          assert written["version"] == os.environ["VERSION"]
          assert written["tag"] == os.environ["TAG_NAME"]
          for name in written["assets"].values():
              assert os.path.isfile(os.path.join("release-assets", name))
          PY

          {
            echo "## ${TAG_NAME} 更新内容"
            echo
            echo "$notes"
            echo
            echo "## 安装说明"
            echo
            echo "- macOS Apple Silicon：推荐下载 DMG 后安装；如需免安装使用，可下载 app.zip 并解压后运行。当前版本未签名、未公证；首次打开若被 Gatekeeper 拦截，请右键应用并选择“打开”，或执行："
            echo '  `xattr -dr com.apple.quarantine /Applications/WorkBuddyBar.app`'
            echo "- Windows x64：下载 NSIS 安装包。若出现 SmartScreen 提示，请选择“更多信息”后点击“仍要运行”。"
          } > RELEASE_BODY.md

          cat RELEASE_BODY.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WorkBuddyBar ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
